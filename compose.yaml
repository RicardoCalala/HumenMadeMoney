services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: hmm
      POSTGRES_PASSWORD: hmm_local_only
      POSTGRES_DB: hmm_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmm -d hmm_local"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - hmm-postgres:/var/lib/postgresql/data

volumes:
  hmm-postgres:
